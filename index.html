<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1d2a47" />
    <title>Stampbook · Every trip, stamped</title>
    <meta name="description" content="A travel journal that turns every trip into a passport stamp. Search a place, add your dates, notes and photos, and see everywhere you've been on a map. Kept on your device." />
    <link rel="canonical" href="https://stampbook.ashwin.co.in/" />
    <meta property="og:site_name" content="Stampbook" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Stampbook · Every trip, stamped" />
    <meta property="og:description" content="Log a trip and it gets stamped into your passport, with your notes, photos and a map of everywhere you've been." />
    <meta property="og:url" content="https://stampbook.ashwin.co.in/" />
    <meta property="og:image" content="https://stampbook.ashwin.co.in/og.jpg?v=2" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Stampbook: an open passport with a map of trips on one page and ink stamps on the other" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stampbook · Every trip, stamped" />
    <meta name="twitter:description" content="Log a trip and it gets stamped into your passport, with your notes, photos and a map of everywhere you've been." />
    <meta name="twitter:image" content="https://stampbook.ashwin.co.in/og.jpg?v=2" />
    <script>
      const query = new URLSearchParams(location.search);
      document.documentElement.dataset.shell =
        location.pathname !== '/' && location.pathname !== '/index.html'
          ? 'missing'
          : query.has('new') || query.get('edit') || query.get('trip')
            ? 'detail'
            : 'home';
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #1d2a47; color-scheme: light; }
      #root { height: 100%; }
      [data-startup-missing] { display: none; }
      html[data-shell="missing"] [data-startup-home],
      html[data-shell="detail"] [data-startup-add] { display: none; }
      html[data-shell="missing"] [data-startup-missing] { display: block; }
    </style>
    <link rel="stylesheet" href="/src/index.css" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Stampbook" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preload" href="/fonts/public-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/barlow-condensed-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/red-hat-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="preconnect" href="https://photon.komoot.io" crossorigin />
    <script>
      for (const face of [
        '400 16px "Public Sans"',
        '600 16px "Barlow Condensed"',
        '700 16px "Barlow Condensed"',
        '400 16px "Red Hat Mono"',
      ]) document.fonts.load(face).catch(() => {});
    </script>
  </head>
  <body>
    <noscript>Stampbook needs JavaScript to open your passport.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
