<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1d2a47" />
    <title>Stampbook · Every trip, stamped</title>
    <meta name="description" content="A travel journal that turns every trip into a passport stamp. Search a place, add your dates, notes and photos, and see everywhere you've been on a map. Kept on your device." />
    <link rel="canonical" href="https://stampbook.ashwin.co.in/" />
    <meta property="og:site_name" content="Stampbook" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Stampbook · Every trip, stamped" />
    <meta property="og:description" content="Log a trip and it gets stamped into your passport, with your notes, photos and a map of everywhere you've been." />
    <meta property="og:url" content="https://stampbook.ashwin.co.in/" />
    <meta property="og:image" content="https://stampbook.ashwin.co.in/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Stampbook: an open passport with a map of trips on one page and ink stamps on the other" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Stampbook · Every trip, stamped" />
    <meta name="twitter:description" content="Log a trip and it gets stamped into your passport, with your notes, photos and a map of everywhere you've been." />
    <meta name="twitter:image" content="https://stampbook.ashwin.co.in/og.jpg" />
    <script>
      if (location.pathname !== '/' && location.pathname !== '/index.html') {
        document.documentElement.dataset.shell = 'missing';
      }
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #1d2a47; color-scheme: light; }
      #root { height: 100%; }
      /* Paint the paper surface before JavaScript arrives, at the book's bounds. */
      #root:empty::before {
        content: "";
        position: fixed;
        top: calc(2.5rem + max(0.75rem, env(safe-area-inset-top)) + 0.75rem);
        bottom: calc(1.75rem + max(0.75rem, env(safe-area-inset-bottom)));
        left: calc(0.75rem + env(safe-area-inset-left));
        right: calc(0.75rem + env(safe-area-inset-right));
        border-radius: 10px;
        background: #eef0e6 url("/paper.svg") 0 0 / 240px 96px;
        box-shadow: 0 0 0 4px #141d33, 0 24px 50px -20px rgb(0 0 0 / 0.6);
        pointer-events: none;
      }
      @media (min-width: 40rem) {
        #root:empty::before {
          left: calc(1.25rem + env(safe-area-inset-left));
          right: calc(1.25rem + env(safe-area-inset-right));
        }
      }
      @media (min-width: 64rem) and (min-height: 36rem) {
        #root:empty::before {
          top: 4.5625rem;
          bottom: 2.625rem;
          left: calc(1.75rem + env(safe-area-inset-left));
          right: calc(1.75rem + env(safe-area-inset-right));
          box-shadow: 0 0 0 6px #141d33, 0 24px 50px -20px rgb(0 0 0 / 0.6);
        }
      }
      @media (max-height: 30rem) {
        #root:empty::before { top: 3.5rem; }
      }
      /* Reserve the 404 card's height, including its responsive text wrapping. */
      html[data-shell="missing"] #root:empty::before {
        content: "This page isn’t in the passport.";
        top: 50%;
        bottom: auto;
        left: 50%;
        right: auto;
        width: min(28rem, calc(100% - 2rem));
        box-sizing: border-box;
        padding: 13rem 1.5rem 6rem;
        color: transparent;
        font: 600 1.125rem / 1.75rem var(--font-sans, sans-serif);
        text-align: center;
        text-wrap: balance;
        transform: translate(-50%, calc(-50% - 1.25rem));
        box-shadow: 0 0 0 5px #141d33, 0 24px 50px -20px rgb(0 0 0 / 0.6);
      }
      @media (min-width: 64rem) and (min-height: 36rem) {
        html[data-shell="missing"] #root:empty::before {
          transform: translate(-50%, calc(-50% - 1.3125rem));
        }
      }
      @media (max-height: 30rem) {
        html[data-shell="missing"] #root:empty::before {
          padding-block: 8rem 4.5rem;
        }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Stampbook" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preload" href="/fonts/public-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/barlow-condensed-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/red-hat-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="preload" href="https://tiles.openfreemap.org/styles/positron" as="fetch" crossorigin />
    <link rel="preload" href="https://tiles.openfreemap.org/planet" as="fetch" crossorigin />
    <link rel="preconnect" href="https://photon.komoot.io" crossorigin />
  </head>
  <body>
    <noscript>Stampbook needs JavaScript to open your passport.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
